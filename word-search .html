<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>वर्ड सर्च पज़ल</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f1f8e9; }
        h1 { margin-bottom: 5px; }
        p { margin-top: 5px; color: #555; }
        .grid { display: grid; grid-template-columns: repeat(6, 40px); grid-template-rows: repeat(6, 40px); gap: 2px; background-color: #33691e; padding: 5px; border-radius: 5px; }
        .cell { width: 40px; height: 40px; background-color: #dcedc8; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; border-radius: 3px; cursor: pointer; }
        .cell.selected { background-color: #81c784; }
        .word-list { margin-top: 20px; display: flex; gap: 20px; font-weight: bold; }
        #win-message { display: none; font-size: 24px; font-weight: bold; color: #2e7d32; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>वर्ड सर्च पज़ल</h1>
    <p>छिपे हुए शब्द खोजें</p>
    <div class="grid" id="grid"></div>
    <div class="word-list">
        <span>GEMINI</span>
        <span>PUZZLE</span>
    </div>
    <div id="win-message">बधाई हो, आपने शब्द खोज लिए!</div>
    <script>
        const gridElement = document.getElementById('grid');
        const winMessage = document.getElementById('win-message');
        const gridSize = 6;
        const gridData = [
            ['G', 'E', 'M', 'I', 'N', 'I'],
            ['A', 'P', 'U', 'Z', 'Z', 'L'],
            ['M', 'E', 'L', 'Z', 'U', 'P'],
            ['E', 'B', 'Z', 'Z', 'U', 'P'],
            ['X', 'P', 'U', 'Z', 'Z', 'L'],
            ['Y', 'P', 'U', 'Z', 'Z', 'L']
        ];
        let selectedCells = [];
        function renderGrid() {
            gridElement.innerHTML = '';
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.innerText = gridData[r][c];
                    cell.addEventListener('click', () => {
                        cell.classList.toggle('selected');
                    });
                    gridElement.appendChild(cell);
                }
            }
        }
        renderGrid();
    </script>
</body>
</html>
